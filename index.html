                                </div>
                            </div>
                        </div>

                        <div className="border border-slate-200 rounded-2xl overflow-hidden print:border-slate-300 print:rounded-none print:mt-2">
                            <table className="w-full text-sm text-left claim-print-table">
                                <thead className="bg-slate-100 text-slate-600 text-xs font-bold uppercase tracking-wider border-b border-slate-200 print:bg-slate-100">
                                    <tr>
                                        <th className="px-3 py-3 w-28">운행일자</th>
                                        <th className="px-3 py-3">출발지</th>
                                        <th className="px-3 py-3">도착지</th>
                                        <th className="px-3 py-3 w-12 text-center">왕복</th>
                                        <th className="px-3 py-3 text-right w-20">거리(km)</th>
                                        <th className="px-3 py-3 w-24">유종</th>
                                        <th className="px-3 py-3 text-right w-24 text-primary-700">적용단가</th>
                                        <th className="px-3 py-3 text-right text-slate-400 w-32 font-normal">상세내역</th>
                                        <th className="px-3 py-3 text-right w-28">산출금액</th>
                                        <th className="px-3 py-3 w-10 text-center print:hidden"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {rows.map((row) => {
                                        const costs = calculateDetails(row);
                                        const standardPrice = getStandardPrice(row.date, row.fuelType);
                                        const isMismatch = row.unitPrice !== standardPrice;

                                        return (
                                            <tr key={row.id} className="hover:bg-slate-50 transition-colors print:hover:bg-transparent">
                                                <td className="px-3 py-2">
                                                    <input type="date" value={row.date} onChange={(e) => updateRow(row.id, 'date', e.target.value)} 
                                                        className="w-full bg-white border border-slate-300 rounded px-1 py-1 focus:border-primary-500 focus:outline-none font-medium text-slate-700 text-xs tabular-nums" />
                                                </td>
                                                <td className="px-3 py-2">
                                                    <input type="text" value={row.start} onChange={(e) => updateRow(row.id, 'start', e.target.value)} 
                                                        className="w-full bg-white border border-slate-300 rounded px-2 py-1 focus:border-primary-500 focus:outline-none text-slate-700" />
                                                </td>
                                                <td className="px-3 py-2 relative">
                                                    <input type="text" value={row.end} onChange={(e) => updateRow(row.id, 'end', e.target.value)} list={`dest-list-${row.id}`} 
                                                        className="w-full bg-white border border-slate-300 rounded px-2 py-1 focus:border-primary-500 focus:outline-none font-bold text-slate-800" 
                                                        placeholder="입력" />
                                                    <datalist id={`dest-list-${row.id}`}>{filteredDestinations.map(d => <option key={d.id} value={d.name}>{d.name} ({d.distance}km)</option>)}</datalist>
                                                </td>
                                                <td className="px-3 py-2 text-center">
                                                    <input type="checkbox" checked={row.isRoundTrip} onChange={(e) => updateRow(row.id, 'isRoundTrip', e.target.checked)} 
                                                        className="w-4 h-4 rounded text-primary-600 focus:ring-primary-500 border-slate-300 print:appearance-auto cursor-pointer" />
                                                </td>
                                                <td className="px-3 py-2 text-right">
                                                    <input type="number" value={row.distance} onChange={(e) => updateRow(row.id, 'distance', parseFloat(e.target.value))} 
                                                        className={`w-full min-w-[64px] text-right bg-white border border-slate-300 rounded px-2 py-1.5 focus:border-primary-500 focus:outline-none tabular-nums font-bold ${row.distance === 0 ? 'text-rose-500 border-rose-200' : 'text-slate-700'}`} />
                                                </td>
                                                <td className="px-3 py-2">
                                                    <select value={row.fuelType} onChange={(e) => updateRow(row.id, 'fuelType', e.target.value)} 
                                                        className="w-full min-w-[84px] bg-white border border-slate-300 rounded px-2 py-1.5 text-[13px] leading-5 focus:border-primary-500 focus:outline-none font-bold text-slate-700">
                                                        {FUEL_TYPES.map(ft => <option key={ft.value} value={ft.value}>{ft.label}</option>)}
                                                    </select>
                                                </td>
                                                <td className="px-3 py-2 text-right relative group">
                                                    <input type="number" value={row.unitPrice} onChange={(e) => updateRow(row.id, 'unitPrice', parseFloat(e.target.value))} 
                                                        className={`w-full text-right bg-white border rounded px-1 py-1 focus:outline-none tabular-nums font-bold 
                                                        ${isMismatch 
                                                            ? 'text-orange-600 border-orange-300 bg-orange-50 focus:border-orange-500' 
                                                            : 'text-primary-700 border-primary-200 focus:border-primary-500'}`} />
                                                    
                                                    {isMismatch && (
                                                        <div className="mt-0.5 text-right">
                                                            <span className="inline-block text-[9px] px-1.5 py-0.5 rounded bg-orange-100 text-orange-700 font-bold mr-1">수동수정</span>
                                                            <span className="text-[9px] text-orange-500 font-bold whitespace-nowrap">기준: {standardPrice.toLocaleString()}</span>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="px-3 py-2 text-right text-[10px] text-slate-400 tabular-nums">
                                                    {costs.fuelCost.toLocaleString()} + {costs.maintCost.toLocaleString()}
                                                </td>
                                                <td className="px-3 py-2 text-right font-bold text-slate-900 tabular-nums">
                                                    {formatCurrency(costs.total)}
                                                </td>
                                                <td className="px-3 py-2 text-center print:hidden">
                                                    <button onClick={() => removeRow(row.id)} className="text-slate-300 hover:text-rose-500 transition"><Trash2 size={14} /></button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {rows.length === 0 && (
                                        <tr><td colSpan="10" className="py-16 text-center text-slate-400 bg-slate-50/30 italic print:hidden">내역을 추가해주세요.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-4 flex justify-end gap-2 print:hidden">
                            <button onClick={saveDraft} className="px-5 py-2.5 bg-white text-red-700 border-2 border-red-200 rounded-xl font-bold shadow-sm hover:bg-red-50 hover:border-red-300 transition flex items-center">
                                <Database size={18} className="mr-2" /> 임시저장
                            </button>
                            <button onClick={addRow} className="px-5 py-2.5 bg-primary-600 text-white rounded-xl font-bold shadow-lg shadow-primary-500/30 hover:bg-primary-700 transition flex items-center">
                                <Plus size={18} className="mr-2" /> 항목 추가
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('claim');
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminPrompt, setShowAdminPrompt] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminError, setAdminError] = useState('');
            const DEFAULT_CONFIG = {
                entities: DEFAULT_ENTITIES,
                sites: DEFAULT_SITES,
                region: '서울', effGasoline: 10, effDiesel: 12, effLpg: 9, effHydrogen: 95, effElectric: 5,
                maintenanceCostPerKm: 200, manualPriceHydrogen: 9900, manualPriceElectric: 300,
                autoSyncEnabled: true, autoSyncIntervalMinutes: 180
            };
            const DEFAULT_DESTINATIONS = [
                { id: 1, name: '서울 본사', distance: 0, entityId: 'hq', siteId: 'hq-seoul', scope: 'site' },
                { id: 2, name: '인천 물류센터', distance: 35, entityId: 'hq', siteId: 'hq-incheon', scope: 'entity' },
                { id: 3, name: '부산 항만 고객사', distance: 18, entityId: 'branch', siteId: 'branch-busan', scope: 'site' },
                { id: 4, name: '공항 출장 터미널', distance: 52, entityId: 'hq', siteId: 'hq-seoul', scope: 'global' }
            ];
            const DEFAULT_PRICES = { gasoline: 1750, diesel: 1620, lpg: 980, hydrogen: 9900, electric: 300, lastUpdated: 'Ready', history: {} };
            const createDefaultClaimDraft = () => ({
                dateKey: getTodayKey(),
                header: {
                    entityId: DEFAULT_ENTITIES[0]?.id || 'hq',
                    siteId: getSitesForEntity(DEFAULT_CONFIG, DEFAULT_ENTITIES[0]?.id || 'hq')[0]?.id || '',
                    dept: '',
                    name: '',
                    submitDate: getTodayKey()
                },
                rows: [],
                savedAt: ''
            });

            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [destinations, setDestinations] = useState(DEFAULT_DESTINATIONS);
            const [prices, setPrices] = useState(DEFAULT_PRICES);
            const [claimDraft, setClaimDraft] = useState(createDefaultClaimDraft);
            const [cloudReady, setCloudReady] = useState(false);
            const [cloudEnabled, setCloudEnabled] = useState(true);
            const [connectionState, setConnectionState] = useState({ status: 'idle', message: '' });
            const [syncState, setSyncState] = useState({ loading: false, status: '준비', error: null });
            const syncInFlightRef = useRef(false);
            const handleOpenAdmin = () => {
                setAdminPassword('');
                setAdminError('');
                setShowAdminPrompt(true);
            };
            const handleLoginAdmin = async () => {
                try {
                    const inputHash = await hashText(adminPassword || '');
                    if (inputHash !== ADMIN_PASSWORD_HASH) {
                        setAdminError('비밀번호가 올바르지 않습니다.');
                        return;
                    }
                    setIsAdmin(true);
                    setShowAdminPrompt(false);
                    setAdminPassword('');
                    setAdminError('');
                } catch (e) {
                    setAdminError('보안 모듈을 사용할 수 없습니다. 브라우저를 확인해주세요.');
                }
            };
            const handleExitAdmin = () => {
                setIsAdmin(false);
                setActiveTab('claim');
            };

            const forceSaveSettings = async () => {
                try {
                    const cloudApi = await getCloudApi();
                    await cloudApi.setDoc(cloudApi.docRef, {
                        config,
                        updatedAt: cloudApi.serverTimestamp()
                    }, { merge: true });
                    setCloudEnabled(true);
                    return { ok: true };
                } catch (err) {
                    console.error("Cloud config save failed:", err);
                    setCloudEnabled(false);
                    return { ok: false, message: err?.message || String(err) };
                }
            };

            const handleCheckConnection = async () => {
                setConnectionState({ status: 'checking', message: '배포된 서버 함수 연결 점검 중...' });
                let statusText = '';
                let errorText = '';
                const ok = await syncOpinetPrices({
                    config,
                    setPrices: () => {},
                    onLoading: () => {},
                    onStatus: (msg) => { statusText = msg; },
                    onError: (msg) => { errorText = msg; }
                });
                if (ok) setConnectionState({ status: 'ok', message: statusText || '연동 정상' });
                else setConnectionState({ status: 'error', message: errorText || statusText || '연동 실패' });
            };
            const runGlobalSync = async (overrideConfig = null, syncOptions = {}) => {
                if (syncInFlightRef.current) return false;
                syncInFlightRef.current = true;
                const targetConfig = overrideConfig || config;
                try {
                    const ok = await syncOpinetPrices({
                        config: targetConfig,
                        setPrices,
                        onLoading: (loading) => setSyncState(prev => ({ ...prev, loading })),
                        onStatus: (status) => setSyncState(prev => ({ ...prev, status })),
                        onError: (error) => setSyncState(prev => ({ ...prev, error })),
                        ...syncOptions
                    });
                    return ok;
                } finally {
                    syncInFlightRef.current = false;
                }
            };

            useEffect(() => {
                const loadCloudData = async () => {
                    try {
                        const cloudApi = await getCloudApi();
                        const snap = await cloudApi.getDoc(cloudApi.docRef);
                        if (snap.exists()) {
                            const data = snap.data() || {};
                            if (data.config) {
                                setConfig({
                                    ...DEFAULT_CONFIG,
                                    ...data.config,
                                    entities: (data.config.entities && data.config.entities.length ? data.config.entities : DEFAULT_ENTITIES),
                                    sites: (data.config.sites && Object.keys(data.config.sites).length ? data.config.sites : DEFAULT_SITES)
                                });
                            }
                            if (Array.isArray(data.destinations)) {
                                const normalizedConfig = {
                                    ...DEFAULT_CONFIG,
                                    ...(data.config || {})
                                };
                                setDestinations(normalizeDestinationList(data.destinations, normalizedConfig));
                            }
                            if (data.prices) {
                                setPrices({
                                    ...DEFAULT_PRICES,
                                    ...data.prices,
                                    history: normalizeAndPruneHistory(
                                        data.prices.history || {},
                                        90
                                    )
                                });
                            }
                            if (data.claimDraft) {
                                const cloudDraft = data.claimDraft.dateKey === getTodayKey()
                                    ? data.claimDraft
                                    : createDefaultClaimDraft();
                                setClaimDraft({
                                    ...createDefaultClaimDraft(),
                                    ...cloudDraft,
                                    header: {
                                        ...createDefaultClaimDraft().header,
                                        ...(cloudDraft.header || {})
                                    },
                                    rows: Array.isArray(cloudDraft.rows) ? cloudDraft.rows : []
                                });
                            }
                        }
                    } catch (err) {
                        console.error("Cloud load failed:", err);
                        setCloudEnabled(false);
                    } finally {
                        setCloudReady(true);
                    }
                };
                loadCloudData();
            }, []);

            useEffect(() => {
                if (!isAdmin && activeTab !== 'claim') {
                    setActiveTab('claim');
                }
            }, [isAdmin, activeTab]);

            useEffect(() => {
                if (!cloudReady) return;
                if (!cloudEnabled) return;
                const timer = setTimeout(async () => {
                    try {
                        const cloudApi = await getCloudApi();
                        await cloudApi.setDoc(cloudApi.docRef, {
                            config,
                            destinations,
                            prices,
                            claimDraft,
                            updatedAt: cloudApi.serverTimestamp()
                        }, { merge: true });
                    } catch (err) {
                        console.error("Cloud save failed:", err);
                        setCloudEnabled(false);
                    }
                }, 500);
                return () => clearTimeout(timer);
                }, [config, destinations, prices, claimDraft, cloudReady, cloudEnabled]);

            return (
                <div className="min-h-screen text-slate-800 pb-20">
                    <Header
                        activeTab={activeTab}
                        setActiveTab={setActiveTab}
                        isAdmin={isAdmin}
                        onOpenAdmin={handleOpenAdmin}
                        onExitAdmin={handleExitAdmin}
                    />
                    <main className="container mx-auto px-4 py-8">
                        {activeTab === 'claim' && <ClaimForm config={config} destinations={destinations} prices={prices} claimDraft={claimDraft} setClaimDraft={setClaimDraft} />}
                        {isAdmin && activeTab === 'distances' && <DistanceManager config={config} destinations={destinations} setDestinations={setDestinations} />}
                        {isAdmin && activeTab === 'prices' && <FuelPrices config={config} prices={prices} setPrices={setPrices} syncState={syncState} onRefresh={runGlobalSync} />}
                        {isAdmin && activeTab === 'settings' && (
                            <SettingsPanel
                                config={config}
                                setConfig={setConfig}
                                connectionState={connectionState}
                                onCheckConnection={handleCheckConnection}
                                onSaveSettings={forceSaveSettings}
                            />
                        )}
                    </main>
                    {showAdminPrompt && (
                        <div className="fixed inset-0 z-[100] bg-black/40 flex items-center justify-center px-4">
                            <div className="w-full max-w-sm bg-white rounded-2xl border border-slate-200 shadow-xl p-6">
                                <h3 className="text-lg font-bold text-slate-800 mb-3">관리자 모드 접속</h3>
                                <input
                                    type="password"
                                    value={adminPassword}
                                    onChange={(e) => setAdminPassword(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === 'Enter') handleLoginAdmin(); }}
                                    placeholder="비밀번호 입력"
                                    className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-200 focus:border-primary-500 outline-none"
                                    autoFocus
                                />
                                {adminError && <p className="mt-2 text-sm text-rose-600">{adminError}</p>}
                                <div className="mt-4 flex justify-end gap-2">
                                    <button onClick={() => setShowAdminPrompt(false)} className="px-4 py-2 rounded-lg border border-slate-300 text-slate-600">취소</button>
                                    <button onClick={handleLoginAdmin} className="px-4 py-2 rounded-lg bg-slate-800 text-white font-semibold">접속</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
