        const FUEL_TYPES = [

        const DEFAULT_ENTITIES = [
            { id: 'hq', name: '본사 법인' },
            { id: 'branch', name: '지사 법인' }
        ];
        const DEFAULT_SITES = {
            hq: [
                { id: 'hq-seoul', name: '서울 본사' },
                { id: 'hq-incheon', name: '인천 물류센터' }
            ],
            branch: [
                { id: 'branch-busan', name: '부산 지사' },
                { id: 'branch-daegu', name: '대구 지사' }
            ]
        };
        const getEntityList = (config) => config.entities || DEFAULT_ENTITIES;
        const getSitesMap = (config) => config.sites || DEFAULT_SITES;
        const getSitesForEntity = (config, entityId) => getSitesMap(config)[entityId] || [];
        const normalizeDestinationList = (items, configLike = {}) => {
            const entities = getEntityList(configLike);
            const sitesMap = getSitesMap(configLike);
            const defaultEntityId = entities[0]?.id || 'hq';
            const defaultSiteId = sitesMap[defaultEntityId]?.[0]?.id || 'hq-seoul';
            return Array.isArray(items)
                ? items.map((item, index) => {
                    const entityId = item?.entityId && sitesMap[item.entityId] ? item.entityId : defaultEntityId;
                    const siteOptions = sitesMap[entityId] || [];
                    const siteId = item?.siteId && siteOptions.some((site) => site.id === item.siteId)
                        ? item.siteId
                        : (siteOptions[0]?.id || defaultSiteId);
                    return {
                        entityId,
                        siteId,
                        scope: item?.scope || 'site',
                        id: item?.id || Date.now() + index,
                        ...item
                    };
                })
                : [];
        };

        const SIDO_CODES = {
            '서울': '01', '경기': '02', '강원': '03', '충북': '04', '충남': '05',
            '전북': '06', '전남': '07', '경북': '08', '경남': '09', '부산': '10',
            '제주': '11', '대구': '14', '인천': '15', '광주': '16', '대전': '17',
            '울산': '18', '세종': '19'
        };

        const MOCK_OPINET_DATA = {
            '서울': { gasoline: 1750, diesel: 1620, lpg: 980 },
            '경기': { gasoline: 1710, diesel: 1590, lpg: 960 },
            '전국평균': { gasoline: 1690, diesel: 1580, lpg: 950 }
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(amount);
        const formatDateString = (dateStr) => {
            if (!dateStr || dateStr.length !== 8) return '';
            return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
        };
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        const ADMIN_PASSWORD_HASH = "1bcc0d24f8766535308c820c9870d2b3fd38787a1e9ab02e056931535ffda132";
        const toHex = (buffer) => Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        const hashText = async (text) => {
            const enc = new TextEncoder();
            const digest = await crypto.subtle.digest('SHA-256', enc.encode(text));
            return toHex(digest);
        };
        const normalizeAndPruneHistory = (history, days = 90) => {
            const source = history || {};
            const mergedByDate = {};
            const parseDate = (value) => {
                if (!value) return null;
                const dateOnly = String(value).slice(0, 10);
                const dt = new Date(`${dateOnly}T00:00:00`);
                return Number.isNaN(dt.getTime()) ? null : { key: dateOnly, date: dt };
            };

            Object.entries(source).forEach(([rawDate, regions]) => {
                const parsed = parseDate(rawDate);
                if (!parsed) return;
                if (!mergedByDate[parsed.key]) mergedByDate[parsed.key] = {};
                Object.entries(regions || {}).forEach(([region, values]) => {
                    if (!mergedByDate[parsed.key][region]) mergedByDate[parsed.key][region] = {};
                    mergedByDate[parsed.key][region] = { ...mergedByDate[parsed.key][region], ...(values || {}) };
                });
            });

            const cutoff = new Date();
            cutoff.setHours(0, 0, 0, 0);
            cutoff.setDate(cutoff.getDate() - (days - 1));

            const result = {};
            Object.keys(mergedByDate).forEach((dateKey) => {
                const dt = new Date(`${dateKey}T00:00:00`);
                if (Number.isNaN(dt.getTime())) return;
                if (dt >= cutoff) result[dateKey] = mergedByDate[dateKey];
            });
            return result;
        };
        const mergeHistoryMaps = (base, incoming) => {
            const result = { ...(base || {}) };
            Object.entries(incoming || {}).forEach(([dateKey, regions]) => {
                if (!result[dateKey]) result[dateKey] = {};
                result[dateKey] = { ...result[dateKey], ...(regions || {}) };
            });
            return result;
        };
        const getTodayKey = () => {
            const now = new Date();
            const kstNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
            const y = kstNow.getFullYear();
            const m = String(kstNow.getMonth() + 1).padStart(2, '0');
            const d = String(kstNow.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };
        const getMissingRegionsForToday = (history) => {
            const today = getTodayKey();
            const todayData = (history && history[today]) || {};
            return Object.keys(SIDO_CODES).filter((regionName) => {
                const row = todayData[regionName];
                return !(row && row.gasoline && row.diesel && row.lpg);
            });
        };

        const syncOpinetPrices = async ({
            config,
            setPrices,
            onLoading = () => {},
            onError = () => {},
            onStatus = () => {},
            allRegions = true,
            targetRegions = null
        }) => {
            onLoading(true);
            onError(null);
            onStatus('클라우드 동기화 요청 중...');

            const finish = (src) => {
                onStatus(src);
                onLoading(false);
            };

            try {
                const response = await fetch(FUEL_SYNC_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        region: config.region,
                        allRegions,
                        targetRegions
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || result.ok === false) {
                    throw new Error(result.error || `HTTP ${response.status}`);
                }

                onStatus('최신 유가 반영 중...');
                const cloudApi = await getCloudApi();
                const snap = await cloudApi.getDoc(cloudApi.docRef);
                if (!snap.exists()) throw new Error('클라우드 유가 문서를 찾을 수 없습니다.');
                const data = snap.data() || {};
                if (!data.prices) throw new Error('클라우드 유가 데이터가 비어 있습니다.');

                setPrices(prev => ({
                    ...prev,
                    ...data.prices,
                    hydrogen: config.manualPriceHydrogen,
                    electric: config.manualPriceElectric,
                    history: normalizeAndPruneHistory(
                        mergeHistoryMaps(prev.history || {}, data.prices.history || {}),
                        90
                    )
                }));

                const syncedRegions = data.fuelSyncStatus?.successRegions || result.successRegions || 0;
                finish(`클라우드 동기화 완료 (${syncedRegions}개 지역 갱신)`);
                return true;
            } catch (err) {
                console.error('Fuel sync failed:', err);
                onError(err?.message || '클라우드 동기화에 실패했습니다.');
                finish('동기화 실패');
                return false;
            }
        };

        // --- Components ---

        const Header = ({ activeTab, setActiveTab, isAdmin, onOpenAdmin, onExitAdmin }) => {
            const navItems = isAdmin
                ? [{ id: 'claim', label: '청구서 작성' }, { id: 'distances', label: '출장지 관리' }, { id: 'prices', label: '실시간 유가' }, { id: 'settings', label: '환경설정' }]
                : [{ id: 'claim', label: '청구서 작성' }];
            return (
            <header className="sticky top-0 z-50 glass border-b border-white/40 shadow-sm print:hidden">
                <div className="container mx-auto px-4 pt-4 pb-3">
                    <div className="hero-shell relative rounded-[28px] px-5 py-4 md:px-7 md:py-4 text-white overflow-hidden">
                        <div className="relative z-10 flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
                            <div className="flex items-start gap-4 group cursor-pointer" onClick={() => setActiveTab('claim')}>
                                <div className="p-3 bg-white/14 rounded-2xl shadow-lg transition-transform group-hover:scale-105">
                                    <Car size={24} className="text-white" />
                                </div>
                                <div>
                                    <h1 className="text-2xl md:text-[30px] font-black tracking-tight text-white">자가차량 유류비 정산 센터</h1>
                                    <p className="mt-1.5 text-sm md:text-[15px] text-slate-200 max-w-2xl">출장 거리, 지역 유가, 청구서 작성, 클라우드 동기화를 하나의 운영 화면에서 관리하는 전문형 비용 정산 도구</p>
                                </div>
                            </div>
                            <div className="flex flex-col items-start gap-3 md:items-end">
                                <div className="flex items-center gap-3">
                                    <nav className="hidden md:flex bg-white/10 p-1.5 rounded-2xl border border-white/10">
                                        {navItems.map((item) => (
                                        <button
                                            key={item.id}
                                            onClick={() => setActiveTab(item.id)}
                                            className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-300 ${
                                                activeTab === item.id
                                                ? 'bg-white text-slate-900 shadow-sm ring-1 ring-black/5'
                                                : 'text-slate-300 hover:text-white hover:bg-white/10'
                                            }`}
                                        >
                                            {item.label}
                                        </button>
                                    ))}
                                    </nav>
                                {!isAdmin ? (
                                    <button
                                        onClick={onOpenAdmin}
                                        className="px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-slate-900 hover:bg-slate-100 transition"
                                    >
                                        관리자 모드 접속
                                    </button>
                                ) : (
                                    <button
                                        onClick={onExitAdmin}
                                        className="px-4 py-2.5 rounded-xl text-xs font-bold bg-rose-500 text-white hover:bg-rose-600 transition"
                                    >
                                        관리자 모드 종료
                                    </button>
                                )}
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div className="md:hidden flex justify-around items-center p-3 bg-white border-t border-slate-200 fixed bottom-0 w-full z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                    {navItems.map(item => (
                        <React.Fragment key={item.id}>
                        <button key={item.id} onClick={() => setActiveTab(item.id)} 
                            className={`p-2 rounded-xl transition-colors ${activeTab === item.id ? 'text-primary-600 bg-primary-50' : 'text-slate-400'}`}>
                            {item.id === 'claim' && <FileText size={20} />}
                            {item.id === 'distances' && <MapPin size={20} />}
                            {item.id === 'prices' && <TrendingUp size={20} />}
                            {item.id === 'settings' && <Settings size={20} />}
                        </button>
                        </React.Fragment>
                    ))}
                    {!isAdmin && (
                        <button onClick={onOpenAdmin} className="p-2 rounded-xl text-slate-500">
                            <Settings size={20} />
                        </button>
                    )}
                    {isAdmin && (
                        <button onClick={onExitAdmin} className="p-2 rounded-xl text-rose-500">
                            <X size={20} />
                        </button>
                    )}
                </div>
            </header>
        );
        };

        const SettingsPanel = ({ config, setConfig, connectionState, onCheckConnection, onSaveSettings }) => {
            const [savingAll, setSavingAll] = useState(false);
            const [saveAllMessage, setSaveAllMessage] = useState('');
            const [newEntityName, setNewEntityName] = useState('');
            const [newSite, setNewSite] = useState({ entityId: getEntityList(config)[0]?.id || 'hq', name: '' });
            const entities = getEntityList(config);
            const sitesMap = getSitesMap(config);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setConfig(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
            };
            const updateEntityName = (entityId, name) => {
                setConfig(prev => ({
                    ...prev,
                    entities: getEntityList(prev).map((item) => item.id === entityId ? { ...item, name } : item)
                }));
            };
            const addEntity = () => {
                const name = (newEntityName || '').trim();
                if (!name) return;
                const id = `ent-${Date.now()}`;
                setConfig(prev => ({
                    ...prev,
                    entities: [...getEntityList(prev), { id, name }],
                    sites: { ...getSitesMap(prev), [id]: [] }
                }));
                setNewEntityName('');
                setNewSite(prev => ({ ...prev, entityId: id }));
            };
            const deleteEntity = (entityId) => {
                setConfig(prev => {
                    const nextEntities = getEntityList(prev).filter((item) => item.id !== entityId);
                    const nextSites = { ...getSitesMap(prev) };
                    delete nextSites[entityId];
                    return {
                        ...prev,
                        entities: nextEntities.length ? nextEntities : getEntityList({}),
                        sites: Object.keys(nextSites).length ? nextSites : getSitesMap({})
                    };
                });
            };
            const updateSiteName = (entityId, siteId, name) => {
                setConfig(prev => ({
                    ...prev,
                    sites: {
                        ...getSitesMap(prev),
                        [entityId]: getSitesForEntity(prev, entityId).map((item) => item.id === siteId ? { ...item, name } : item)
                    }
                }));
            };
            const addSite = () => {
                const name = (newSite.name || '').trim();
                if (!name) return;
                setConfig(prev => ({
                    ...prev,
                    sites: {
                        ...getSitesMap(prev),
                        [newSite.entityId]: [...getSitesForEntity(prev, newSite.entityId), { id: `site-${Date.now()}`, name }]
                    }
                }));
                setNewSite(prev => ({ ...prev, name: '' }));
            };
            const deleteSite = (entityId, siteId) => {
                setConfig(prev => ({
                    ...prev,
                    sites: {
                        ...getSitesMap(prev),
                        [entityId]: getSitesForEntity(prev, entityId).filter((item) => item.id !== siteId)
                    }
                }));
            };
            const saveAllSettings = async () => {
                setSavingAll(true);
                const result = await onSaveSettings();
                setSavingAll(false);
                setSaveAllMessage(
                    result.ok
                        ? '환경설정 저장 완료'
                        : `로컬 저장 완료 (클라우드 저장 실패${result.message ? `: ${result.message}` : ''})`
                );
                setTimeout(() => setSaveAllMessage(''), 4000);
            };
            const statusMeta = {
                idle: { dot: 'bg-slate-400', text: '미확인' },
                checking: { dot: 'bg-amber-500', text: '점검 중' },
                ok: { dot: 'bg-emerald-500', text: '정상' },
                error: { dot: 'bg-rose-500', text: '오류' }
            }[connectionState?.status || 'idle'];
            return (
                <div className="max-w-4xl mx-auto animate-slide-up mb-24 md:mb-8">
                    <div className="surface-panel rounded-[28px] overflow-hidden">
                        <div className="p-8 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-sand-100/70">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center">
                                <Settings className="mr-3 text-primary-600" strokeWidth={2.5} /> 
                                시스템 환경설정
                            </h2>
                            <p className="text-slate-500 mt-1 ml-9 text-sm">동기화 정책, 차량 효율, 정산 기준값을 운영 관점에서 관리합니다.</p>
                        </div>
                        
                        <div className="p-8 space-y-10">
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 mb-4 flex items-center uppercase tracking-wide">
                                    <span className="w-2 h-2 rounded-full bg-primary-500 mr-2"></span> 데이터 연동
                                </h3>
                                <div className="bg-slate-50 rounded-xl p-6 border border-slate-200">
                                    <label className="block text-sm font-bold text-slate-700 mb-2">서버 유가 동기화</label>
                                    <div className="flex flex-col md:flex-row gap-3">
                                        <button
                                            type="button"
                                            onClick={() => onCheckConnection()}
                                            disabled={connectionState?.status === 'checking'}
                                            className="px-5 py-3 bg-slate-800 text-white rounded-lg font-bold hover:bg-slate-900 transition whitespace-nowrap disabled:opacity-70"
                                        >
                                            {connectionState?.status === 'checking' ? '점검 중...' : '연동 점검'}
                                        </button>
                                        <input
                                            type="text"
                                            value={FUEL_SYNC_FUNCTION_URL}
                                            readOnly
                                            className="flex-1 px-4 py-3 bg-white border border-slate-300 rounded-lg text-sm text-slate-500 shadow-input"
                                        />
                                    </div>
                                    <div className="mt-2 flex items-center gap-3 text-xs">
                                        <span className={`inline-block w-2.5 h-2.5 rounded-full ${statusMeta.dot} ${connectionState?.status === 'checking' ? 'animate-pulse' : ''}`}></span>
                                        <span className="font-semibold text-slate-600">통신 연동상태: {statusMeta.text}</span>
                                    </div>
                                    {connectionState?.message && (
                                        <p className="mt-1 text-[11px] text-slate-500">{connectionState.message}</p>
                                    )}
                                    <p className="mt-2 text-xs text-slate-500 flex items-center">
                                        <AlertCircle size={12} className="mr-1" /> 브라우저와 무관하게 서버 스케줄러가 주기적으로 유가를 수집하고, 연동 점검은 수동 즉시 실행입니다.
                                    </p>
                                    <div className="mt-5 grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <label className="flex items-center justify-between gap-3 rounded-lg border border-slate-200 bg-white px-4 py-3">
                                            <span className="text-sm font-semibold text-slate-700">자동 동기화 사용</span>
                                            <input
                                                type="checkbox"
                                                name="autoSyncEnabled"
                                                checked={!!config.autoSyncEnabled}
                                                onChange={handleChange}
                                                className="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500"
                                            />
                                        </label>
                                        <label className="rounded-lg border border-slate-200 bg-white px-4 py-3">
                                            <span className="block text-sm font-semibold text-slate-700 mb-2">자동 동기화 주기(분)</span>
                                            <input
                                                type="number"
                                                name="autoSyncIntervalMinutes"
                                                min="15"
                                                step="15"
                                                value={config.autoSyncIntervalMinutes || 360}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-200 focus:border-primary-500 outline-none"
                                            />
                                        </label>
                                    </div>
                                </div>
                            </section>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <section>
                                    <h3 className="text-xs font-bold text-slate-500 mb-4 flex items-center uppercase tracking-wide">
                                        <span className="w-2 h-2 rounded-full bg-rose-500 mr-2"></span> 기본 설정
                                    </h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">유가 기준 지역</label>
                                            <div className="relative">
                                                <select name="region" value={config.region} onChange={handleChange} 
                                                    className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-200 focus:border-primary-500 outline-none appearance-none shadow-input font-medium text-slate-700">
                                                    {REGIONS.map(r => <option key={r} value={r}>{r}</option>)}
                                                </select>
                                                <div className="absolute right-4 top-3.5 pointer-events-none text-slate-400">▼</div>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">km당 유지보수비</label>
                                            <div className="relative">
                                                <input type="number" name="maintenanceCostPerKm" value={config.maintenanceCostPerKm} onChange={handleChange} 
                                                    className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-200 focus:border-primary-500 outline-none shadow-input font-medium text-slate-700" />
                                                <span className="absolute right-4 top-3.5 text-slate-400 text-sm font-medium">원/km</span>
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section>
                                    <h3 className="text-xs font-bold text-slate-500 mb-4 flex items-center uppercase tracking-wide">
                                        <span className="w-2 h-2 rounded-full bg-orange-500 mr-2"></span> 수소/전기 기준 단가 (수동)
                                    </h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">수소 (kg당)</label>
                                            <div className="relative">
                                                <input type="number" name="manualPriceHydrogen" value={config.manualPriceHydrogen} onChange={handleChange} 
                                                    className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-200 focus:border-amber-500 outline-none shadow-input font-medium text-slate-700" />
                                                <span className="absolute right-4 top-3.5 text-slate-400 text-sm font-medium">원</span>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">전기 (kWh당)</label>
                                            <div className="relative">
                                                <input type="number" name="manualPriceElectric" value={config.manualPriceElectric} onChange={handleChange} 
                                                    className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-200 focus:border-amber-500 outline-none shadow-input font-medium text-slate-700" />
                                                <span className="absolute right-4 top-3.5 text-slate-400 text-sm font-medium">원</span>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>

                            <section>
                                <h3 className="text-xs font-bold text-slate-500 mb-4 flex items-center uppercase tracking-wide">
                                    <span className="w-2 h-2 rounded-full bg-red-800 mr-2"></span> 차량 연비 설정
                                </h3>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    {[{ id: 'effGasoline', label: '휘발유', unit: 'km/L' }, { id: 'effDiesel', label: '경유', unit: 'km/L' }, { id: 'effLpg', label: 'LPG', unit: 'km/L' }, { id: 'effHydrogen', label: '수소', unit: 'km/kg' }, { id: 'effElectric', label: '전기', unit: 'km/kWh' }].map((item) => (
                                        <div key={item.id} className="bg-white p-4 rounded-xl border border-slate-200 hover:border-primary-300 transition-colors shadow-sm">
                                            <label className="text-xs font-bold text-slate-500 block mb-2">{item.label}</label>
                                            <div className="flex items-baseline border-b border-slate-200 pb-1 focus-within:border-primary-500">
                                                <input type="number" name={item.id} value={config[item.id]} onChange={handleChange} 
                                                    className="w-full bg-transparent text-lg font-bold text-slate-800 focus:outline-none p-0" />
                                                <span className="text-[10px] text-slate-400 ml-1 whitespace-nowrap">{item.unit}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                            <section>
                                <h3 className="text-xs font-bold text-slate-500 mb-4 flex items-center uppercase tracking-wide">
                                    <span className="w-2 h-2 rounded-full bg-slate-700 mr-2"></span> 법인 / 사업장 관리
                                </h3>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5">
                                        <div className="flex items-center justify-between mb-4">
                                            <h4 className="text-sm font-bold text-slate-800">법인 목록</h4>
                                            <div className="text-xs text-slate-400">{entities.length}개</div>
                                        </div>
                                        <div className="space-y-3 mb-4">
                                            {entities.map((entity) => (
                                                <div key={entity.id} className="flex items-center gap-2">
                                                    <input
                                                        type="text"
                                                        value={entity.name}
                                                        onChange={(e) => updateEntityName(entity.id, e.target.value)}
                                                        className="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm font-semibold"
                                                    />
                                                    <button type="button" onClick={() => deleteEntity(entity.id)} className="px-3 py-2 rounded-lg bg-rose-50 text-rose-600 text-xs font-bold">삭제</button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={newEntityName}
                                                onChange={(e) => setNewEntityName(e.target.value)}
                                                placeholder="신규 법인명"
                                                className="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm"
                                            />
                                            <button type="button" onClick={addEntity} className="px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-bold">추가</button>
                                        </div>
                                    </div>
                                    <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5">
                                        <div className="flex items-center justify-between mb-4">
                                            <h4 className="text-sm font-bold text-slate-800">사업장 목록</h4>
                                            <select
                                                value={newSite.entityId}
                                                onChange={(e) => setNewSite({ ...newSite, entityId: e.target.value })}
                                                className="px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm"
                                            >
                                                {entities.map((entity) => <option key={entity.id} value={entity.id}>{entity.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-3 mb-4 max-h-64 overflow-auto pr-1">
                                            {entities.map((entity) => (
                                                <div key={entity.id} className="rounded-xl border border-slate-200 bg-white p-3">
                                                    <div className="text-xs font-bold text-slate-500 mb-2">{entity.name}</div>
                                                    <div className="space-y-2">
                                                        {getSitesForEntity(config, entity.id).map((site) => (
                                                            <div key={site.id} className="flex items-center gap-2">
                                                                <input
                                                                    type="text"
                                                                    value={site.name}
                                                                    onChange={(e) => updateSiteName(entity.id, site.id, e.target.value)}
                                                                    className="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm"
                                                                />
                                                                <button type="button" onClick={() => deleteSite(entity.id, site.id)} className="px-3 py-2 rounded-lg bg-rose-50 text-rose-600 text-xs font-bold">삭제</button>
                                                            </div>
                                                        ))}
                                                        {!getSitesForEntity(config, entity.id).length && <div className="text-xs text-slate-400">등록된 사업장 없음</div>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={newSite.name}
                                                onChange={(e) => setNewSite({ ...newSite, name: e.target.value })}
                                                placeholder="신규 사업장명"
                                                className="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm"
                                            />
                                            <button type="button" onClick={addSite} className="px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-bold">추가</button>
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <section className="pt-2">
                                <div className="flex items-center justify-end gap-3">
                                    {saveAllMessage && <span className="text-xs font-semibold text-slate-600">{saveAllMessage}</span>}
                                    <button
                                        type="button"
                                        onClick={saveAllSettings}
                                        disabled={savingAll}
                                        className="px-6 py-3 bg-primary-600 text-white rounded-lg font-bold hover:bg-primary-700 transition disabled:opacity-70"
                                    >
                                        {savingAll ? '저장 중...' : '환경설정 저장'}
                                    </button>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            );
        };

        const FuelPrices = ({ config, prices, setPrices, syncState, onRefresh }) => {
            const [viewRegion, setViewRegion] = useState(config.region);

            useEffect(() => {
                setViewRegion(config.region);
            }, [config.region]);

            useEffect(() => {
                setPrices(prev => ({
                    ...prev,
                    hydrogen: config.manualPriceHydrogen,
                    electric: config.manualPriceElectric
                }));
            }, [config.manualPriceHydrogen, config.manualPriceElectric]);

            const fetchPrices = async () => {
                await onRefresh();
            };

            // 선택된 지역의 히스토리만 필터링하여 보여주기
            const getRegionHistory = () => {
                if (!prices.history) return [];
                return Object.entries(prices.history)
                    .filter(([date, regions]) => regions[viewRegion])
                    .map(([date, regions]) => ({ date, ...regions[viewRegion] }))
                    .sort((a, b) => new Date(b.date) - new Date(a.date));
            };

            const regionHistoryData = getRegionHistory();
            const latestRegionData = regionHistoryData[0] || null;
            const currentCardPrices = {
                gasoline: latestRegionData?.gasoline ?? (viewRegion === config.region ? prices.gasoline : 0),
                diesel: latestRegionData?.diesel ?? (viewRegion === config.region ? prices.diesel : 0),
                lpg: latestRegionData?.lpg ?? (viewRegion === config.region ? prices.lpg : 0),
                hydrogen: prices.hydrogen,
                electric: prices.electric
            };

            return (
                <div className="max-w-5xl mx-auto animate-slide-up mb-24 md:mb-8">
                    <div className="surface-panel rounded-[28px] p-8 md:p-9">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 flex items-center">
                                    <TrendingUp className="mr-3 text-primary-600" /> 실시간 유가 대시보드
                                </h2>
                                <p className="mt-2 text-sm text-slate-500">지역별 적재 단가와 최근 누적 이력을 운영 기준으로 조회합니다.</p>
                                <div className="flex flex-wrap items-center mt-2 gap-3">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-bold text-slate-500">조회 지역</span>
                                        <select
                                            value={viewRegion}
                                            onChange={(e) => setViewRegion(e.target.value)}
                                            className="px-2.5 py-1 rounded-md bg-white text-slate-700 text-xs font-bold border border-slate-300"
                                        >
                                            {REGIONS.map(r => <option key={r} value={r}>{r}</option>)}
                                        </select>
                                    </div>
                                    <span className="px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 text-xs font-bold border border-slate-200">
                                        환경설정 지역: {config.region}
                                    </span>
                                    <span className={`px-2.5 py-1 rounded-md text-xs font-bold flex items-center border ${
                                        (syncState.status || '').includes('API') ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-amber-50 text-amber-600 border-amber-100'
                                    }`}>
                                        <div className={`w-1.5 h-1.5 rounded-full mr-2 ${(syncState.status || '').includes('API') ? 'bg-emerald-500' : 'bg-amber-500'}`}></div>
                                        {syncState.status || '준비'}
                                    </span>
                                    {regionHistoryData.length > 0 && (
                                        <span className="px-2.5 py-1 rounded-md bg-rose-50 text-rose-600 text-xs font-bold border border-rose-100 flex items-center">
                                            <Database size={12} className="mr-1"/> {viewRegion} 데이터 {regionHistoryData.length}건 보유
                                        </span>
                                    )}
                                </div>
                            </div>
                            <button onClick={fetchPrices} disabled={syncState.loading} 
                                className="px-6 py-3 bg-primary-600 text-white rounded-2xl font-bold shadow-lg hover:bg-primary-700 transition-all disabled:opacity-70 flex items-center">
                                <RefreshCw className={`mr-2 h-4 w-4 ${syncState.loading ? 'animate-spin' : ''}`} />
                                {syncState.loading ? '동기화 중...' : '가격정보 새로고침'}
                            </button>
                        </div>

                        {syncState.error && (
                            <div className="mb-6 bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-xl text-sm flex items-center">
                                <AlertCircle size={16} className="mr-2" /> {syncState.error}
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-7">
                            <div className="rounded-2xl bg-slate-900 text-white px-5 py-4">
                                <div className="text-[11px] uppercase tracking-[0.24em] text-slate-300">조회 지역</div>
                                <div className="mt-2 text-2xl font-black">{viewRegion}</div>
                            </div>
                            <div className="rounded-2xl bg-white border border-slate-200 px-5 py-4">
                                <div className="text-[11px] uppercase tracking-[0.24em] text-slate-400">최근 갱신</div>
                                <div className="mt-2 text-sm font-semibold text-slate-800">{prices.lastUpdated || '기록 없음'}</div>
                            </div>
                            <div className="rounded-2xl bg-white border border-slate-200 px-5 py-4">
                                <div className="text-[11px] uppercase tracking-[0.24em] text-slate-400">저장 이력</div>
                                <div className="mt-2 text-2xl font-black text-slate-900">{regionHistoryData.length}</div>
                            </div>
                        </div>

                        {/* Current Prices Cards */}
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                            {[
                                { label: '휘발유', key: 'gasoline', color: 'text-red-700 bg-red-50 border-red-200', icon: '⛽' },
                                { label: '경유', key: 'diesel', color: 'text-rose-700 bg-rose-50 border-rose-200', icon: '🚛' },
                                { label: 'LPG', key: 'lpg', color: 'text-orange-700 bg-orange-50 border-orange-200', icon: '🔥' },
                                { label: '수소', key: 'hydrogen', color: 'text-pink-700 bg-pink-50 border-pink-200', icon: '💧', manual: true },
                                { label: '전기', key: 'electric', color: 'text-slate-700 bg-slate-100 border-slate-200', icon: '⚡', unit: 'kWh', manual: true }
                            ].map((item) => (
                                <div key={item.key} className={`relative p-5 rounded-2xl border transition-all duration-300 hover:shadow-md ${item.color} bg-opacity-40`}>
                                    {item.manual && <span className="absolute top-2 right-3 text-[10px] uppercase font-bold tracking-wider opacity-60">수동설정</span>}
                                    <div className="text-2xl mb-2">{item.icon}</div>
                                    <div className="text-xs font-bold uppercase tracking-wider opacity-70 mb-1">{item.label}</div>
                                    <div className="text-xl font-bold tracking-tight text-slate-900">
                                        {(currentCardPrices[item.key] || 0).toLocaleString()}
                                        <span className="text-xs font-medium opacity-60 ml-1">원/{item.unit || 'L'}</span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* History Table */}
                        <div className="border-t border-slate-100 pt-6">
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center">
                                <div className="w-1 h-6 bg-slate-800 rounded-full mr-3"></div>
                                일별 유가 변동 내역 ({viewRegion} 기준)
                            </h3>
                            <div className="overflow-hidden rounded-xl border border-slate-200">
                                <table className="w-full text-sm text-left">
                                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                        <tr>
                                            <th className="px-6 py-3 font-bold">날짜</th>
                                            <th className="px-6 py-3 text-right text-red-600 font-bold">휘발유</th>
                                            <th className="px-6 py-3 text-right text-rose-600 font-bold">경유</th>
                                            <th className="px-6 py-3 text-right text-orange-600 font-bold">LPG</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 bg-white">
                                        {regionHistoryData.length > 0 ? (
                                            regionHistoryData.map((data) => (
                                                <tr key={data.date} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-3 font-medium text-slate-700">{data.date}</td>
                                                    <td className="px-6 py-3 text-right tabular-nums">{data.gasoline?.toLocaleString()}</td>
                                                    <td className="px-6 py-3 text-right tabular-nums">{data.diesel?.toLocaleString()}</td>
                                                    <td className="px-6 py-3 text-right tabular-nums">{data.lpg?.toLocaleString()}</td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr><td colSpan="4" className="px-6 py-8 text-center text-slate-400 italic">저장된 '{config.region}' 지역의 데이터가 없습니다. 상단 버튼을 눌러 데이터를 동기화하세요.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <p className="mt-2 text-xs text-slate-400 text-right">* 이제 지역을 변경해도 기존 데이터가 사라지지 않고 누적됩니다.</p>
                        </div>
                    </div>
                </div>
            );
        };

        const DistanceManager = ({ config, destinations, setDestinations }) => {
            const entities = getEntityList(config);
            const [newItem, setNewItem] = useState({ name: '', distance: '', entityId: entities[0]?.id || 'hq', siteId: getSitesForEntity(config, entities[0]?.id || 'hq')[0]?.id || '', scope: 'site' });
            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState({ name: '', distance: '', entityId: entities[0]?.id || 'hq', siteId: getSitesForEntity(config, entities[0]?.id || 'hq')[0]?.id || '', scope: 'site' });

            const addDestination = () => {
                if (newItem.name && newItem.distance) {
                    setDestinations([...destinations, { ...newItem, id: Date.now(), distance: parseFloat(newItem.distance) }]);
                    setNewItem({ name: '', distance: '', entityId: newItem.entityId, siteId: newItem.siteId, scope: newItem.scope });
                }
            };
            const removeDestination = (id) => setDestinations(destinations.filter(d => d.id !== id));
            
            const startEdit = (dest) => { setEditingId(dest.id); setEditForm({ name: dest.name, distance: dest.distance, entityId: dest.entityId || entities[0]?.id || 'hq', siteId: dest.siteId || getSitesForEntity(config, dest.entityId || entities[0]?.id || 'hq')[0]?.id || '', scope: dest.scope || 'site' }); };
            const saveEdit = () => { setDestinations(destinations.map(d => d.id === editingId ? { ...d, ...editForm, distance: parseFloat(editForm.distance) } : d)); setEditingId(null); };

            return (
                <div className="max-w-4xl mx-auto animate-slide-up mb-24 md:mb-8">
                    <div className="surface-panel rounded-[28px] p-8">
                        <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center">
                            <MapPin className="mr-3 text-primary-600" /> 출장지 데이터베이스
                        </h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-6 gap-4 mb-8 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                            <select className="px-4 py-3 bg-white border border-slate-300 rounded-lg shadow-input focus:ring-2 focus:ring-primary-500 outline-none font-medium" value={newItem.entityId} onChange={(e) => setNewItem({...newItem, entityId: e.target.value, siteId: getSitesForEntity(config, e.target.value)[0]?.id || ''})}>
                                {entities.map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
                            </select>
                            <select className="px-4 py-3 bg-white border border-slate-300 rounded-lg shadow-input focus:ring-2 focus:ring-primary-500 outline-none font-medium" value={newItem.siteId} onChange={(e) => setNewItem({...newItem, siteId: e.target.value})}>
                                {getSitesForEntity(config, newItem.entityId).map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
                            </select>
                            <select className="px-4 py-3 bg-white border border-slate-300 rounded-lg shadow-input focus:ring-2 focus:ring-primary-500 outline-none font-medium" value={newItem.scope} onChange={(e) => setNewItem({...newItem, scope: e.target.value})}>
                                <option value="site">사업장 전용</option>
                                <option value="entity">법인 공용</option>
                                <option value="global">전사 공용</option>
                            </select>
                            <input type="text" placeholder="새로운 출장지 명칭" className="md:col-span-2 px-4 py-3 bg-white border border-slate-300 rounded-lg shadow-input focus:ring-2 focus:ring-primary-500 outline-none font-medium" value={newItem.name} onChange={(e) => setNewItem({...newItem, name: e.target.value})} />
                            <div className="flex flex-1 gap-2">
                                <input type="number" placeholder="거리" className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg shadow-input focus:ring-2 focus:ring-primary-500 outline-none font-medium" value={newItem.distance} onChange={(e) => setNewItem({...newItem, distance: e.target.value})} />
                                <span className="flex items-center text-sm font-bold text-slate-500 whitespace-nowrap px-2">km</span>
                            </div>
                            <button onClick={addDestination} className="px-6 py-3 bg-primary-600 text-white rounded-lg font-bold shadow-lg hover:bg-primary-700 transition-all flex items-center justify-center">
                                <Plus size={18} className="mr-1" /> 등록
                            </button>
                        </div>

                        <div className="overflow-hidden rounded-xl border border-slate-200">
                            <table className="w-full text-left">
                                <thead className="bg-slate-100 border-b border-slate-200">
                                    <tr>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">적용범위</th>
                                        <th className="p-4 text-xs font-bold text-slate-500 uppercase tracking-wider">출장지</th>
                                        <th className="p-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">편도 거리</th>
                                        <th className="p-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">왕복 기준</th>
                                        <th className="p-4 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">관리</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {destinations.length === 0 ? (<tr><td colSpan="5" className="p-10 text-center text-slate-400">데이터가 없습니다.</td></tr>) : (destinations.map((dest) => (
                                        <tr key={dest.id} className="group hover:bg-slate-50 transition-colors">
                                            {editingId === dest.id ? (
                                                <>
                                                    <td className="p-3 space-y-2">
                                                        <select value={editForm.entityId} onChange={e => setEditForm({...editForm, entityId: e.target.value, siteId: getSitesForEntity(config, e.target.value)[0]?.id || ''})} className="w-full p-2 bg-white border border-primary-500 rounded outline-none shadow-sm">
                                                            {entities.map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
                                                        </select>
                                                        <select value={editForm.siteId} onChange={e => setEditForm({...editForm, siteId: e.target.value})} className="w-full p-2 bg-white border border-primary-500 rounded outline-none shadow-sm">
                                                            {getSitesForEntity(config, editForm.entityId).map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
                                                        </select>
                                                        <select value={editForm.scope} onChange={e => setEditForm({...editForm, scope: e.target.value})} className="w-full p-2 bg-white border border-primary-500 rounded outline-none shadow-sm">
                                                            <option value="site">사업장 전용</option>
                                                            <option value="entity">법인 공용</option>
                                                            <option value="global">전사 공용</option>
                                                        </select>
                                                    </td>
                                                    <td className="p-3"><input type="text" value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} className="w-full p-2 bg-white border border-primary-500 rounded outline-none shadow-sm" autoFocus /></td>
                                                    <td className="p-3 text-right"><input type="number" value={editForm.distance} onChange={e => setEditForm({...editForm, distance: e.target.value})} className="w-24 p-2 bg-white border border-primary-500 rounded text-right outline-none shadow-sm" /></td>
                                                    <td className="p-3 text-right text-slate-300">-</td>
                                                    <td className="p-3 text-center flex justify-center gap-2">
                                                        <button onClick={saveEdit} className="p-2 bg-emerald-100 text-emerald-600 rounded-lg hover:bg-emerald-200"><Check size={16} /></button>
                                                        <button onClick={() => setEditingId(null)} className="p-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200"><X size={16} /></button>
                                                    </td>
                                                </>
                                            ) : (
                                                <>
                                                    <td className="p-4">
                                                        <div className="text-sm font-bold text-slate-700">{entities.find(item => item.id === dest.entityId)?.name || '본사 법인'}</div>
                                                        <div className="text-xs text-slate-500">{dest.scope === 'global' ? '전사 공용' : dest.scope === 'entity' ? '법인 공용' : getSitesForEntity(config, dest.entityId || entities[0]?.id || 'hq').find(item => item.id === dest.siteId)?.name || '사업장 전용'}</div>
                                                    </td>
                                                    <td className="p-4 font-bold text-slate-700">{dest.name}</td>
                                                    <td className="p-4 text-right font-medium text-slate-600">{dest.distance} km</td>
                                                    <td className="p-4 text-right text-slate-400 font-normal">{(dest.distance * 2).toFixed(1)} km</td>
                                                    <td className="p-4 text-center flex justify-center gap-2">
                                                        <button onClick={() => startEdit(dest)} className="p-2 text-primary-500 hover:bg-primary-50 rounded-lg"><Edit2 size={16} /></button>
                                                        <button onClick={() => removeDestination(dest.id)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg"><Trash2 size={16} /></button>
                                                    </td>
                                                </>
                                            )}
                                        </tr>
                                    )))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const ClaimForm = ({ config, destinations, prices, claimDraft, setClaimDraft }) => {
            const entities = getEntityList(config);
            const todayKey = getTodayKey();
            const allSiteNames = Object.values(getSitesMap(config))
                .flat()
                .map((item) => item.name);
            const getDefaultHeader = () => ({
                entityId: entities[0]?.id || 'hq',
                siteId: getSitesForEntity(config, entities[0]?.id || 'hq')[0]?.id || '',
                dept: '',
                name: '',
                submitDate: getTodayKey()
            });
            const getActiveDraft = () => (
                claimDraft && claimDraft.dateKey === todayKey
                    ? claimDraft
                    : null
            );
            const [header, setHeader] = useState(() => {
                const saved = getActiveDraft();
                return saved?.header || getDefaultHeader();
            });
            const [rows, setRows] = useState(() => {
                const saved = getActiveDraft();
                if (Array.isArray(saved?.rows)) return saved.rows;
                return [];
            });
            const [draftSavedAt, setDraftSavedAt] = useState(() => {
                const saved = getActiveDraft();
                return saved?.savedAt || '';
            });
            const [showDraftToast, setShowDraftToast] = useState(false);
            const availableSites = getSitesForEntity(config, header.entityId);
            const currentSiteName = availableSites.find((item) => item.id === header.siteId)?.name || '회사';
            const filteredDestinations = destinations.filter((dest) => (
                dest.scope === 'global' ||
                (dest.scope === 'entity' && dest.entityId === header.entityId) ||
                ((dest.scope || 'site') === 'site' && dest.entityId === header.entityId && dest.siteId === header.siteId)
            ));
            const getAutoUnitPrice = (date, fuelType) => {
                const history = prices.history || {};
                const region = config.region;
                const exact = history?.[date]?.[region]?.[fuelType];
                if (exact) return exact;

                // exact 날짜가 없으면, 해당 날짜 이전의 가장 최근 단가를 사용
                const target = new Date(`${date}T00:00:00`).getTime();
                const fallback = Object.keys(history)
                    .filter((d) => {
                        const t = new Date(`${d}T00:00:00`).getTime();
                        return !Number.isNaN(t) && t <= target && history[d]?.[region]?.[fuelType];
                    })
                    .sort((a, b) => new Date(b) - new Date(a))[0];

                if (fallback) return history[fallback][region][fuelType];
                return prices[fuelType] || 0;
            };
            
            const addRow = () => {
                const defaultFuel = 'gasoline';
                const today = getTodayKey();
                const currentPrice = getAutoUnitPrice(today, defaultFuel) || 1700;
                
                setRows([...rows, { 
                    id: Date.now(), 
                    date: today, 
                    start: currentSiteName, 
                    end: '', 
                    isRoundTrip: true, 
                    distance: 0, 
                    fuelType: defaultFuel,
                    unitPrice: currentPrice
                }]);
            };
            
            const updateRow = (id, field, value) => {
                setRows(rows.map(row => {
                    if (row.id !== id) return row;
                    let updatedRow = { ...row, [field]: value };
                    
                    if (field === 'end') { 
                        const knownDest = filteredDestinations.find(d => d.name === value); 
                        if (knownDest) updatedRow.distance = parseFloat(knownDest.distance); 
                    }
                    
                    // 날짜/유종 변경 시 지역+날짜에 맞는 히스토리 데이터 조회
                    if (field === 'date' || field === 'fuelType') {
                        const dateToCheck = field === 'date' ? value : updatedRow.date;
                        const fuelToCheck = field === 'fuelType' ? value : updatedRow.fuelType;
                        updatedRow.unitPrice = getAutoUnitPrice(dateToCheck, fuelToCheck);
                    }

                    return updatedRow;
                }));
            };
            const removeRow = (id) => setRows(rows.filter(r => r.id !== id));

            useEffect(() => {
                setRows((prevRows) => prevRows.map((row) => {
                    if (row.start === '회사' || row.start === '' || allSiteNames.includes(row.start)) {
                        return { ...row, start: currentSiteName };
                    }
                    return row;
                }));
            }, [currentSiteName]);

            useEffect(() => {
                const saved = getActiveDraft();
                if (!saved) {
                    setHeader(getDefaultHeader());
                    setRows([]);
                    setDraftSavedAt('');
                    return;
                }
                setHeader(saved.header || getDefaultHeader());
                setRows(Array.isArray(saved.rows) ? saved.rows : []);
                setDraftSavedAt(saved.savedAt || '');
            }, [claimDraft?.dateKey, claimDraft?.savedAt]);

            useEffect(() => {
                setClaimDraft((prev) => {
                    const nextDraft = {
                        dateKey: todayKey,
                        header,
                        rows,
                        savedAt: prev?.dateKey === todayKey ? (prev.savedAt || '') : ''
                    };
                    if (
                        prev?.dateKey === nextDraft.dateKey &&
                        JSON.stringify(prev?.header || null) === JSON.stringify(nextDraft.header) &&
                        JSON.stringify(prev?.rows || []) === JSON.stringify(nextDraft.rows) &&
                        (prev?.savedAt || '') === nextDraft.savedAt
                    ) {
                        return prev;
                    }
                    return nextDraft;
                });
            }, [todayKey, header, rows, setClaimDraft]);
            
            const calculateDetails = (row) => {
                const dist = row.isRoundTrip ? row.distance * 2 : row.distance;
                let eff = 10;
                
                if (row.fuelType === 'gasoline') eff = config.effGasoline;
                else if (row.fuelType === 'diesel') eff = config.effDiesel;
                else if (row.fuelType === 'lpg') eff = config.effLpg;
                else if (row.fuelType === 'hydrogen') eff = config.effHydrogen;
                else if (row.fuelType === 'electric') eff = config.effElectric;
                
                if (eff <= 0) eff = 1;

                const priceToUse = row.unitPrice || 0;
                const fuelCost = (dist / eff) * priceToUse;
                const maintCost = dist * config.maintenanceCostPerKm;
                const total = Math.round(fuelCost + maintCost);
                return { total, fuelCost: Math.round(fuelCost), maintCost: Math.round(maintCost) };
            };

            const totalAmount = rows.reduce((sum, row) => sum + calculateDetails(row).total, 0);
            const saveDraft = () => {
                const now = new Date().toLocaleString();
                setDraftSavedAt(now);
                setClaimDraft({
                    dateKey: todayKey,
                    header,
                    rows,
                    savedAt: now
                });
                setShowDraftToast(true);
                setTimeout(() => setShowDraftToast(false), 1500);
            };

            // 표준 단가 조회 헬퍼 함수
            const getStandardPrice = (date, fuelType) => {
                return getAutoUnitPrice(date, fuelType);
            };

            return (
                <div className="max-w-[1200px] mx-auto animate-slide-up mb-24 md:mb-8 print-safe-area">
                    <div className="flex justify-between items-center mb-6 print:hidden">
                        <div className="flex items-center text-sm font-medium text-slate-500 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200">
                             <Info size={16} className="mr-2 text-primary-500" />
                             팁: 운행일자와 유종에 맞는 저장 단가가 있으면 자동 적용됩니다.
                        </div>
                        <div className="flex space-x-3">
                            <button onClick={() => window.print()} className="px-5 py-2.5 bg-slate-800 text-white rounded-xl font-bold shadow-lg hover:bg-slate-900 transition flex items-center">
                                <Printer size={18} className="mr-2" /> PDF 저장
                            </button>
                        </div>
                    </div>
                    {draftSavedAt && (
                        <div className="mb-4 text-xs text-slate-500 print:hidden">임시저장됨: {draftSavedAt}</div>
                    )}
                    {showDraftToast && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[120] px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold shadow-lg print:hidden">
                            임시저장되었습니다.
                        </div>
                    )}

                    {/* PDF 인쇄 영역 (높이 제약 제거 및 스타일 최적화) */}
                    <div className="surface-panel rounded-[32px] p-8 md:p-12 print:shadow-none print:p-0 print:rounded-none w-full print:w-full">
                        <div className="hidden print:block print-document-header">
                            <div className="print-document-title">자가차량 유류비 청구서</div>
                            <div className="print-document-subtitle">출장 운행 기록과 지역 유가 기준단가를 반영한 정산 문서</div>
                            <div className="print-document-meta">
                                <span>청구일자: {header.submitDate || '-'}</span>
                                <span>기준 지역: {config.region}</span>
                                <span>출력 시각: {new Date().toLocaleDateString('ko-KR')}</span>
                            </div>
                        </div>
                        
                        <div className="mb-10 rounded-[28px] hero-shell px-7 py-7 text-white print:hidden">
                            <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
                                <div>
                                    <div className="text-[11px] uppercase tracking-[0.28em] text-slate-300">청구 작업</div>
                                    <h1 className="mt-3 text-4xl font-extrabold tracking-tight mb-2">유류비 청구서</h1>
                                    <p className="text-sm text-slate-200">출장 운행 기록, 지역 유가 기준단가, 유지보수비를 반영한 표준 청구 화면</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3 md:min-w-[320px]">
                                    <div className="metric-chip rounded-2xl px-4 py-3">
                                        <div className="text-[11px] uppercase tracking-[0.22em] text-slate-300">청구 건수</div>
                                        <div className="mt-2 text-2xl font-black">{rows.length}</div>
                                    </div>
                                    <div className="metric-chip rounded-2xl px-4 py-3">
                                        <div className="text-[11px] uppercase tracking-[0.22em] text-slate-300">총 청구금액</div>
                                        <div className="mt-2 text-lg font-black">{formatCurrency(totalAmount)}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-8 mb-10 print:mb-6 print-summary-grid items-stretch">
                            <div className="print-info-card rounded-2xl border border-slate-200 bg-white p-5 flex flex-col justify-between">
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2 print-section-title">청구자 정보</h3>
                                <div className="block space-y-3 print:hidden">
                                    <div className="flex items-center">
                                        <span className="w-24 text-sm font-bold text-slate-500">법 인</span>
                                        <select className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-bold focus:ring-2 focus:ring-primary-500 outline-none" value={header.entityId} onChange={e=>setHeader({...header, entityId: e.target.value, siteId: getSitesForEntity(config, e.target.value)[0]?.id || ''})}>
                                            {entities.map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-center">
                                        <span className="w-24 text-sm font-bold text-slate-500">사업장</span>
                                        <select className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-bold focus:ring-2 focus:ring-primary-500 outline-none" value={header.siteId} onChange={e=>setHeader({...header, siteId: e.target.value})}>
                                            {availableSites.map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-center">
                                        <span className="w-24 text-sm font-bold text-slate-500">소속 부서</span>
                                        <input type="text" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-bold focus:ring-2 focus:ring-primary-500 outline-none print:border-none print:p-0" placeholder="부서명" value={header.dept} onChange={e=>setHeader({...header, dept: e.target.value})} />
                                    </div>
                                    <div className="flex items-center">
                                        <span className="w-24 text-sm font-bold text-slate-500">성 명</span>
                                        <input type="text" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-bold focus:ring-2 focus:ring-primary-500 outline-none print:border-none print:p-0" placeholder="이름" value={header.name} onChange={e=>setHeader({...header, name: e.target.value})} />
                                    </div>
                                    <div className="flex items-center">
                                        <span className="w-24 text-sm font-bold text-slate-500">청구 일자</span>
                                        <input type="date" className="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-800 font-medium focus:ring-2 focus:ring-primary-500 outline-none print:border-none print:p-0" value={header.submitDate} onChange={e=>setHeader({...header, submitDate: e.target.value})} />
                                    </div>
                                </div>
                                <div className="hidden print:grid print-info-compact">
                                    <span className="print-info-label">법 인</span>
                                    <span className="print-info-value">{entities.find(item => item.id === header.entityId)?.name || '-'}</span>
                                    <span className="print-info-label">사업장</span>
                                    <span className="print-info-value">{availableSites.find(item => item.id === header.siteId)?.name || '-'}</span>
                                    <span className="print-info-label">소속 부서</span>
                                    <span className="print-info-value">{header.dept || '-'}</span>
                                    <span className="print-info-label">성 명</span>
                                    <span className="print-info-value">{header.name || '-'}</span>
                                    <span className="print-info-label">청구 일자</span>
                                    <span className="print-info-value">{header.submitDate || '-'}</span>
                                    <span className="print-info-label">기준 지역</span>
                                    <span className="print-info-value">{config.region}</span>
                                </div>
                            </div>
                            
                            <div className="bg-slate-850 rounded-2xl p-5 text-white flex flex-col justify-between shadow-2xl min-h-[244px] border border-red-900/40 print:bg-transparent print:text-black print:shadow-none print:p-0 print:border print:border-slate-200 print-total-card">
                                <div className="print-total-body">
                                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 print-section-title print:mb-0 print:border-0 print:p-0">총 청구금액</h3>
                                    <p className="text-xs text-slate-500 mb-3 print:hidden">유류비 및 유지보수비 포함</p>
                                    <div className="text-right print:mt-0">
                                        <div className="text-[36px] font-black tracking-tight print-total-amount">{formatCurrency(totalAmount)}</div>
                                    </div>
                                </div>
                                <div className="text-right print:hidden">
                                    <div className="text-xs text-slate-500 mt-2 font-medium print:hidden">원화 기준</div>
